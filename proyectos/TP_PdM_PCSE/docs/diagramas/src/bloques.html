<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 700; fill: #1f2937; }
  .s  { font-size: 11px; fill: #4b5563; }
  .p  { font-size: 11px; fill: #1f2937; font-family: 'DejaVu Sans Mono', Consolas, monospace; }
  .bus { font-size: 11.5px; font-weight: 700; fill: #6d28d9; }
  .title { font-size: 16px; font-weight: 700; fill: #111827; }
  .leg { font-size: 11px; fill: #374151; }
</style></head>
<body>
<svg id="blk" width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="title">Diagrama en bloques — Estación de medición ambiental</text>

  <!-- ===== MCU ===== -->
  <rect x="380" y="90" width="240" height="380" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/>
  <text x="500" y="122" text-anchor="middle" class="t" style="font-size:16px">NUCLEO-F446RE</text>
  <text x="500" y="140" text-anchor="middle" class="s">STM32F446RE · Cortex-M4</text>
  <!-- internal peripheral tags -->
  <g font-size="11" font-weight="700">
    <rect x="392" y="200" width="62" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="423" y="233" text-anchor="middle" fill="#5b21b6">I2C1</text>
    <rect x="546" y="150" width="62" height="34" rx="6" fill="#fce7f3" stroke="#db2777"/>
    <text x="577" y="172" text-anchor="middle" fill="#9d174d">USART2</text>
    <rect x="546" y="200" width="62" height="74" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="577" y="234" text-anchor="middle" fill="#92400e">TIM3</text>
    <text x="577" y="250" text-anchor="middle" fill="#92400e" font-weight="400" font-size="10">encoder</text>
    <rect x="546" y="288" width="62" height="84" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="577" y="320" text-anchor="middle" fill="#92400e">GPIO</text>
    <text x="577" y="336" text-anchor="middle" fill="#92400e" font-weight="400" font-size="10">entradas</text>
    <rect x="420" y="400" width="160" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="500" y="425" text-anchor="middle" fill="#991b1b">GPIO salidas</text>
    <rect x="460" y="300" width="70" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="495" y="322" text-anchor="middle" fill="#374151">SysTick</text>
  </g>

  <!-- ===== I2C bus (left) ===== -->
  <g stroke="#7c3aed" stroke-width="2.2" fill="none">
    <path d="M392 220 H250"/>
    <path d="M392 240 H262"/>
    <path d="M250 150 V400"/>
    <path d="M262 160 V410"/>
  </g>
  <text x="314" y="212" text-anchor="middle" class="p">SCL PB8</text>
  <text x="314" y="258" text-anchor="middle" class="p">SDA PB9</text>
  <text x="256" y="138" text-anchor="middle" class="bus">Bus I2C1 · 100 kHz</text>
  <g stroke="#7c3aed" stroke-width="2.2">
    <path d="M250 175 H220"/><path d="M262 195 H220"/>
    <path d="M250 365 H220"/><path d="M262 385 H220"/>
  </g>
  <circle cx="250" cy="175" r="3.5" fill="#7c3aed"/><circle cx="262" cy="195" r="3.5" fill="#7c3aed"/>
  <circle cx="250" cy="365" r="3.5" fill="#7c3aed"/><circle cx="262" cy="385" r="3.5" fill="#7c3aed"/>
  <circle cx="250" cy="220" r="3.5" fill="#7c3aed"/><circle cx="262" cy="240" r="3.5" fill="#7c3aed"/>

  <!-- BME280 -->
  <rect x="40" y="145" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="178" text-anchor="middle" class="t">BME280</text>
  <text x="130" y="196" text-anchor="middle" class="s">Temp · Humedad · Presión</text>
  <text x="130" y="212" text-anchor="middle" class="p">0x76</text>

  <!-- LCD -->
  <rect x="40" y="335" width="180" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="130" y="366" text-anchor="middle" class="t">LCD 16x2</text>
  <text x="130" y="384" text-anchor="middle" class="s">HD44780 + PCF8574</text>
  <text x="130" y="400" text-anchor="middle" class="p">0x27</text>

  <!-- ===== PC (top right) ===== -->
  <path d="M608 167 H790" stroke="#db2777" stroke-width="2.2" marker-start="url(#a)" marker-end="url(#a)" fill="none"/>
  <text x="705" y="159" text-anchor="middle" class="p">TX PA2 / RX PA3</text>
  <text x="705" y="184" text-anchor="middle" class="s">USB · ST-LINK VCP</text>
  <rect x="790" y="132" width="170" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="875" y="162" text-anchor="middle" class="t">PC</text>
  <text x="875" y="180" text-anchor="middle" class="s">Terminal serie 115200</text>

  <!-- ===== Encoder ===== -->
  <rect x="790" y="214" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="875" y="246" text-anchor="middle" class="t">Encoder KY-040</text>
  <text x="875" y="264" text-anchor="middle" class="s">A · B · SW</text>
  <g stroke="#d97706" stroke-width="2" fill="none">
    <path d="M790 224 H608" marker-end="url(#a)"/>
    <path d="M790 252 H608" marker-end="url(#a)"/>
    <path d="M790 280 H700 V300 H608" marker-end="url(#a)"/>
  </g>
  <text x="705" y="218" text-anchor="middle" class="p">A  PA6</text>
  <text x="705" y="246" text-anchor="middle" class="p">B  PA7</text>
  <text x="745" y="274" text-anchor="middle" class="p">SW PB5</text>

  <!-- ===== Buttons ===== -->
  <rect x="790" y="300" width="78" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="829" y="333" text-anchor="middle" class="t">OK</text>
  <rect x="882" y="300" width="78" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="921" y="333" text-anchor="middle" class="t">BACK</text>
  <g stroke="#d97706" stroke-width="2" fill="none">
    <path d="M790 328 H608" marker-end="url(#a)"/>
    <path d="M921 356 V380 H700 V352 H608" marker-end="url(#a)"/>
  </g>
  <text x="745" y="322" text-anchor="middle" class="p">PB10</text>
  <text x="790" y="396" text-anchor="middle" class="p">PB4</text>

  <!-- ===== Outputs (bottom) ===== -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M460 440 V510" marker-end="url(#a)"/>
    <path d="M540 440 V510" marker-end="url(#a)"/>
  </g>
  <text x="452" y="482" text-anchor="end" class="p">PA5</text>
  <text x="548" y="482" class="p">PA10</text>
  <rect x="380" y="510" width="110" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="435" y="536" text-anchor="middle" class="t">LED</text>
  <text x="435" y="553" text-anchor="middle" class="s">alarma</text>
  <rect x="510" y="510" width="110" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="536" text-anchor="middle" class="t">Buzzer</text>
  <text x="565" y="553" text-anchor="middle" class="s">alarma</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40,480)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="20" y="11" class="leg">Sensado</text>
    <rect x="0" y="22" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0284c7"/><text x="20" y="33" class="leg">Visualización</text>
    <rect x="0" y="44" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="20" y="55" class="leg">Entradas de usuario</text>
    <rect x="160" y="0" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="180" y="11" class="leg">Salidas de alarma</text>
    <rect x="160" y="22" width="14" height="14" rx="3" fill="#fce7f3" stroke="#db2777"/><text x="180" y="33" class="leg">Comunicación</text>
    <rect x="160" y="44" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/><text x="180" y="55" class="leg">Bus I2C compartido</text>
  </g>
</svg>
<script>
</script>
</body></html>
